[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeworld"
version = "1.0.0"
description = "Graph-RAG code understanding: knowledge graph, verified-citation Q&A, change impact, AI-PR guardrail, MCP server"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.23", "tree-sitter-python>=0.23", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23",
  "networkx>=3.2", "numpy>=1.26", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "python-multipart>=0.0.9",
  "pydantic>=2.6", "pyyaml>=6.0",
]
[project.optional-dependencies]
jedi = ["jedi>=0.19"]
st = ["sentence-transformers>=3.0", "einops>=0.7"]
dev = ["pytest>=8.0", "ruff>=0.1.0"]
[project.scripts]
codeworld = "codeworld.cli:main"
[tool.setuptools.packages.find]
include = ["codeworld*"]
[tool.setuptools.package-data]
codeworld = ["evaluation/datasets/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741", "F401", "F841"]
