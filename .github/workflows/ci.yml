# CI for CodeWorld itself. Push this project to GitHub and these jobs give you free test results on Windows, macOS and Linux.
name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff>=0.1.0
      - run: ruff check backend

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"
      - run: python -m pip install -U pip && pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - name: doctor (informational – no API keys in CI)
        run: python -m codeworld doctor
        working-directory: backend
        env: { PYTHONPATH: "." }
        continue-on-error: true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: frontend
      - run: node --check extension.js && node test/smoke.js
        working-directory: vscode-extension
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codeworld .
      - run: |
          docker run -d --name cw -p 8000:8000 codeworld
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 2; done
          docker logs cw; exit 1
