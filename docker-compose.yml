services:
  codeworld:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["codeworld-data:/data"]
    restart: unless-stopped
  # Optional: free local LLM on CPU. Start with:  docker compose --profile llm up -d
  # then:  docker compose exec ollama ollama pull qwen2.5-coder:3b
  # and set in .env:  CODEWORLD_LLM_PROVIDER=ollama  CODEWORLD_LLM_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]
volumes:
  codeworld-data:
  ollama:
